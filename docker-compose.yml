version: '3.8'

services:
  app:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/mantenimientoplus
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-at-least-32-characters-long}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-at-least-32-characters-long}
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    networks:
      - mantenimientoplus

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - app
    networks:
      - mantenimientoplus

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mantenimientoplus
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mantenimientoplus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantenimientoplus

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - mantenimientoplus

volumes:
  postgres_data:

networks:
  mantenimientoplus:
    driver: bridge
